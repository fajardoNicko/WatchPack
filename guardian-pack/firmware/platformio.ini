; Guardian Pack firmware — LilyGO T-A7670G + L76K GPS (ESP32-WROVER-E), PCB V1.4
; One PlatformIO project, one environment per bring-up step. Each env compiles only
; src/common/ plus its own sketch folder (build_src_filter), so the steps can't
; interfere with each other. Pick the step with `default_envs` or `pio run -e <env>`.
;
; Base settings mirror LilyGO's official [env:T-A7670X] in LilyGO-T-A76XX/platformio.ini.

[platformio]
default_envs = hello_board

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DLILYGO_T_A7670
    -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------------
; Step 0 — toolchain, upload, serial, IO0 button, battery voltage. No wiring.
[env:hello_board]
build_src_filter = +<common/> +<00_hello_board/>

; Step 1 — modem power-on + AT bridge (SIM, signal, LTE registration)
[env:modem_at]
build_src_filter = +<common/> +<01_modem_at/>

; Step 2 — L76K GPS on Serial2 → lat/lng
[env:gps_l76k]
build_src_filter = +<common/> +<02_gps_l76k/>
lib_deps = mikalhart/TinyGPSPlus@^1.1.0

; Step 3 — IO0 press → SMS with a maps link
[env:sms_send]
build_src_filter = +<common/> +<03_sms_send/>
lib_deps = mikalhart/TinyGPSPlus@^1.1.0

; Step 4 — SOS button (IO32) + buzzer driver (IO18). Needs Phase 2 wiring.
[env:pins_test]
build_src_filter = +<common/> +<04_pins_test/>

; Step 5 — the demo firmware: location to Firestore over LTE/HTTPS, Find device, SOS
[env:cloud]
build_src_filter = +<common/> +<05_cloud/>
lib_deps = mikalhart/TinyGPSPlus@^1.1.0
